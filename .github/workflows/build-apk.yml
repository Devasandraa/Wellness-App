name: Build Android APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack project
        run: unzip -q project.zip
      - run: npm install
      - run: npx cap add android
      - name: Configure Android (min SDK + Health Connect permissions)
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms=''.join('<uses-permission android:name="android.permission.health.%s"/>'%x for x in ['READ_STEPS','READ_HEART_RATE','READ_SLEEP'])
          perms+='<queries><package android:name="com.google.android.apps.healthdata"/></queries>'
          s=s.replace('</manifest>',perms+'</manifest>')
          s=s.replace('</activity>','<intent-filter><action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/></intent-filter></activity>',1)
          open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WellSense-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk